name: Xingyu
options:
  bundleIdPrefix: com.xingyu
  deploymentTarget:
    iOS: '14.0'
configs:
  Debug: debug
  Release: release
targets:
  Xingyu:
    type: application
    platform: iOS
    sources: [Sources]
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xingyu.reply
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Xingyu.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Xingyu-Bridging-Header.h
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        CLANG_ENABLE_OBJC_ARC: YES
    dependencies:
      - sdk: WebKit.framework
      - sdk: UIKit.framework
      - sdk: Security.framework
  XingyuTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xingyu.reply.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
    dependencies:
      - target: Xingyu
schemes:
  Xingyu:
    build:
      targets:
        Xingyu: all
    test:
      targets: [XingyuTests]
